name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gdscript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install gdtoolkit==4.5.0
      - name: gdlint
        run: gdlint addons/playtrace tools tests demo
      - name: gdformat --check
        run: gdformat --check --line-length 120 addons/playtrace tools tests demo

  gdunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Godot from .godot-version
        run: |
          v=$(cat .godot-version)
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${v}-stable/Godot_v${v}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${v}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: $GODOT_BIN --headless --path . --import
      - name: Run GdUnit4
        run: bash addons/gdUnit4/runtest.sh --headless --ignoreHeadlessMode -a res://tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gdunit-reports
          path: reports/

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
      - name: Migrations match the model
        run: dotnet tool restore && dotnet ef migrations has-pending-model-changes --project src/Playtrace.Server
        env:
          ConnectionStrings__Playtrace: Host=localhost
      # T29-T33 use Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test --logger "console;verbosity=normal"

  docker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t playtrace-server .
      - name: docker compose smoke test (migrate, create-project, upload, list)
        run: |
          docker compose up -d --build
          for i in $(seq 60); do curl -sf http://localhost:8080/health && break; sleep 2; done
          out=$(docker compose exec -T server dotnet Playtrace.Server.dll create-project ci)
          echo "$out" | sed 's/pt_[a-z]*_[A-Za-z0-9_-]*/<key>/g'
          ingest=$(echo "$out" | grep -o 'pt_ingest_[A-Za-z0-9_-]*')
          read=$(echo "$out" | grep -o 'pt_read_[A-Za-z0-9_-]*')
          gzip -c ../tests/fixtures/completed.jsonl > /tmp/s.gz
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/v1/sessions \
            -H "Authorization: Bearer $ingest" -H 'Content-Encoding: gzip' -H 'Content-Type: application/x-ndjson' \
            --data-binary @/tmp/s.gz)
          test "$code" = 201
          curl -sf http://localhost:8080/v1/sessions -H "Authorization: Bearer $read" | grep -q 0b6f2c1e-4a8d-4c1b-9f3e-2a7d5c8e1f01
      - if: failure()
        run: docker compose logs

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path addons/gdUnit4 './**/*.md'
          fail: true
