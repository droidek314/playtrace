name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gdscript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdtoolkit==4.5.0
      - name: gdlint
        run: gdlint addons/playtrace tools tests
      - name: gdformat --check
        run: gdformat --check --line-length 120 addons/playtrace tools tests

  gdunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot from .godot-version
        run: |
          v=$(cat .godot-version)
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${v}-stable/Godot_v${v}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${v}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: $GODOT_BIN --headless --path . --import
      - name: Run GdUnit4
        run: bash addons/gdUnit4/runtest.sh --headless --ignoreHeadlessMode -a res://tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdunit-reports
          path: reports/

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
      - run: dotnet test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t playtrace-server server

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path addons/gdUnit4 './**/*.md'
          fail: true
