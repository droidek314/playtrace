# Playtrace server + PostgreSQL. Run from server/: docker compose up -d
# The server applies database migrations on start. See docs/SELF_HOSTING.md.
services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Playtrace: "Host=db;Database=playtrace;Username=playtrace;Password=${POSTGRES_PASSWORD:-playtrace}"
      Playtrace__UploadsPerMinute: ${PLAYTRACE_UPLOADS_PER_MINUTE:-60}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: playtrace
      POSTGRES_USER: playtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playtrace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playtrace"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
